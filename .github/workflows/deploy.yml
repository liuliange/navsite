name: Deploy to Cloudflare Workers

on:
  # 手动触发
  workflow_dispatch:
  # 每 12 小时自动部署一次（UTC 时间 0:30 和 12:30，避开整点高峰）
  schedule:
    - cron: "30 0,12 * * *"

permissions:
  contents: read

concurrency:
  group: deploy-binguo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 不指定 version：自动读取 package.json 的 packageManager 字段（pnpm@10.x）

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (OpenNext for Cloudflare)
        run: pnpm exec opennextjs-cloudflare build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_LINKS_DB_ID: ${{ secrets.NOTION_LINKS_DB_ID }}
          NOTION_WEBSITE_CONFIG_ID: ${{ secrets.NOTION_WEBSITE_CONFIG_ID }}
          NOTION_CATEGORIES_DB_ID: ${{ secrets.NOTION_CATEGORIES_DB_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Upload runtime secrets to Worker
        run: |
          echo "${{ secrets.NOTION_TOKEN }}" | npx wrangler secret put NOTION_TOKEN --name binguo
          echo "${{ secrets.NOTION_LINKS_DB_ID }}" | npx wrangler secret put NOTION_LINKS_DB_ID --name binguo
          echo "${{ secrets.NOTION_WEBSITE_CONFIG_ID }}" | npx wrangler secret put NOTION_WEBSITE_CONFIG_ID --name binguo
          echo "${{ secrets.NOTION_CATEGORIES_DB_ID }}" | npx wrangler secret put NOTION_CATEGORIES_DB_ID --name binguo
          echo "${{ secrets.NEXT_PUBLIC_SITE_URL }}" | npx wrangler secret put NEXT_PUBLIC_SITE_URL --name binguo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers (OpenNext)
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
